<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Toyota Yaris Cross 交車檢查</title>

<style>

body {
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:15px;
}

h1 {
    font-size:22px;
    text-align:center;
}

.progress-box {
    background:white;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    text-align:center;
}

.progress {
    height:18px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
}

.progress-bar {
    height:100%;
    width:0%;
    background:#4CAF50;
}

.category {
    font-size:18px;
    font-weight:bold;
    margin-top:20px;
}

.item {
    background:white;
    border-radius:12px;
    padding:12px;
    margin:8px 0;
}

.item label {
    display:flex;
    align-items:center;
    font-size:16px;
}

.item input[type="checkbox"] {
    width:24px;
    height:24px;
    margin-right:10px;
}

.note {
    width:95%;
    margin-top:8px;
    padding:8px;
    border-radius:8px;
    border:1px solid #ccc;
}

button {
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    font-size:16px;
    background:#333;
    color:white;
}

</style>

</head>

<body>

<h1>🚗 Toyota Yaris Cross<br>交車驗車 Checklist</h1>

<div class="progress-box">

完成進度：
<span id="count">0 / 0</span>

<div class="progress">
<div class="progress-bar" id="bar"></div>
</div>

</div>


<div id="list"></div>


<button onclick="saveData()">
💾 儲存檢查紀錄
</button>


<button onclick="clearData()">
🗑 清除重新開始
</button>

  
<script>

const items = [

["🚗 外觀檢查",
"車身烤漆無刮傷、凹痕、色差"],

["🚗 外觀檢查",
"車門、引擎蓋、尾門縫隙平均"],

["🚗 外觀檢查",
"擋風玻璃、車窗無刮痕或裂痕"],

["🚗 外觀檢查",
"LED頭燈、尾燈功能正常"],


["🛞 輪胎檢查",
"四輪輪胎品牌一致"],

["🛞 輪胎檢查",
"輪胎製造日期（DOT）確認"],

["🛞 輪胎檢查",
"胎壓正常"],

["🛞 輪胎檢查",
"輪圈無刮傷"],


["🪑 內裝檢查",
"座椅無污損破損"],

["🪑 內裝檢查",
"儀表板無故障警示燈"],

["🪑 內裝檢查",
"冷氣冷房正常"],

["🪑 內裝檢查",
"中控螢幕操作正常"],


["📱 電子設備",
"Apple CarPlay / Android Auto正常"],

["📱 電子設備",
"藍牙連線正常"],

["📱 電子設備",
"USB / Type-C功能正常"],


["🛡 Toyota Safety Sense",
"ACC主動車距巡航正常"],

["🛡 Toyota Safety Sense",
"LTA車道循跡輔助正常"],

["🛡 Toyota Safety Sense",
"PCS預警防護系統正常"],

["🛡 Toyota Safety Sense",
"AHB自動遠光燈正常"],


["📷 停車輔助",
"倒車顯影正常"],

["📷 停車輔助",
"倒車雷達正常"],

["📷 停車輔助",
"360環景功能正常（如有）"],


["👶 兒童安全 ISOFIX",
"後座ISOFIX固定扣確認"],

["👶 兒童安全 ISOFIX",
"Top Tether上固定點確認"],

["👶 兒童安全 ISOFIX",
"兒童安全座椅實際安裝測試"],

["👶 兒童安全 ISOFIX",
"兒童安全鎖功能確認"],


["🎁 配件確認",
"行車紀錄器可正常錄影"],

["🎁 配件確認",
"隔熱紙品牌及型號確認"],

["🎁 配件確認",
"腳踏墊確認"],

["🎁 配件確認",
"後廂托盤確認"],


["📄 文件確認",
"第二把智慧鑰匙確認"],

["📄 文件確認",
"保固手冊確認"],

["📄 文件確認",
"VIN車身號碼與文件一致"],

["📄 文件確認",
"保險資料確認"],


["📸 交車紀錄",
"交車里程確認"],

["📸 交車紀錄",
"全車外觀拍照留存"],

["📸 交車紀錄",
"底盤無漏油漏水"],

];


const list=document.getElementById("list");


items.forEach((item,index)=>{

let div=document.createElement("div");

div.className="item";

div.innerHTML=`

<label>
<input type="checkbox" id="check${index}" onclick="updateProgress()">
${item[1]}
</label>

<input 
class="note"
id="note${index}"
placeholder="備註">

`;

list.appendChild(div);

});


document.getElementById("count").innerHTML=
"0 / "+items.length;


</script>


  </body>
</html>


<script>

function updateProgress(){

let done=0;

items.forEach((item,index)=>{

let check=document.getElementById("check"+index);

if(check.checked){
done++;
}

});


let total=items.length;

let percent=Math.round(done/total*100);


document.getElementById("count").innerHTML=
done+" / "+total+" ("+percent+"%)";


document.getElementById("bar").style.width=
percent+"%";


}


function saveData(){

let data=[];


items.forEach((item,index)=>{

data.push({

checked:
document.getElementById("check"+index).checked,

note:
document.getElementById("note"+index).value

});

});


localStorage.setItem(
"YarisCrossChecklist",
JSON.stringify(data)
);


alert("✅ 檢查紀錄已儲存");


}



function loadData(){

let data=
JSON.parse(
localStorage.getItem("YarisCrossChecklist")
);


if(!data){
return;
}


data.forEach((item,index)=>{


let check=
document.getElementById("check"+index);


let note=
document.getElementById("note"+index);



if(check){

check.checked=item.checked;

}


if(note){

note.value=item.note;

}


});


updateProgress();

}



function clearData(){

if(confirm("確定要清除所有檢查紀錄嗎？")){


localStorage.removeItem(
"YarisCrossChecklist"
);


location.reload();


}


}



window.onload=function(){

loadData();

};


</script>


</body>

</html>
