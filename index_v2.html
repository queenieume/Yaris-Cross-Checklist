<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Toyota Yaris Cross 交車檢查 Pro
</title>


<style>

body{
font-family:
-apple-system,
BlinkMacSystemFont,
"Noto Sans TC",
sans-serif;

background:#f5f5f5;

padding:15px;

margin:0;

}


h1{

text-align:center;

font-size:22px;

}



.card{

background:white;

padding:15px;

border-radius:12px;

margin-bottom:15px;

}



input,textarea,select{

width:100%;

padding:10px;

margin-top:6px;

border-radius:8px;

border:1px solid #ccc;

box-sizing:border-box;

font-size:16px;

}



.item{

background:white;

padding:12px;

border-radius:12px;

margin:8px 0;

}



.item-title{

font-size:16px;

font-weight:bold;

}



.status{

margin-top:8px;

}



button{

width:100%;

padding:14px;

border:none;

border-radius:10px;

background:#333;

color:white;

font-size:16px;

margin-top:10px;

}



.progress{

height:18px;

background:#ddd;

border-radius:10px;

overflow:hidden;

}



.bar{

height:100%;

width:0%;

background:#4CAF50;

}


.category{

font-size:18px;

font-weight:bold;

margin-top:20px;

}


</style>

</head>


<body>


<h1>
🚗 Toyota Yaris Cross<br>
交車檢查 Pro V2.1
</h1>


<div class="card">

<h3>🚘 車輛資料</h3>


<input id="owner" placeholder="車主姓名">


<input id="color" placeholder="車身顏色">


<input id="plate" placeholder="車牌號碼">


<input id="date" type="date">


<input id="sales" placeholder="業務姓名">


</div>



<div class="card">

完成進度：

<span id="count">
0 / 0
</span>


<div class="progress">

<div class="bar" id="bar"></div>

</div>


</div>



<div id="list"></div>

  <script>

const items = [

["🚗 外觀檢查","車身烤漆無刮傷、凹痕、色差"],
["🚗 外觀檢查","車門、引擎蓋、尾門縫隙平均"],
["🚗 外觀檢查","玻璃無刮痕或裂痕"],
["🚗 外觀檢查","頭燈、尾燈功能正常"],


["🛞 輪胎檢查","四輪輪胎品牌一致"],
["🛞 輪胎檢查","輪胎製造日期 DOT 確認"],
["🛞 輪胎檢查","胎壓正常"],
["🛞 輪胎檢查","輪圈無刮傷"],


["🪑 內裝檢查","座椅無污損破損"],
["🪑 內裝檢查","儀表板無故障燈號"],
["🪑 內裝檢查","冷氣功能正常"],
["🪑 內裝檢查","中控螢幕操作正常"],


["📱 電子設備","Apple CarPlay / Android Auto正常"],
["📱 電子設備","藍牙連線正常"],
["📱 電子設備","USB / Type-C功能正常"],


["🛡 Toyota Safety Sense","ACC主動車距巡航正常"],
["🛡 Toyota Safety Sense","LTA車道循跡輔助正常"],
["🛡 Toyota Safety Sense","PCS預警防護正常"],
["🛡 Toyota Safety Sense","AHB自動遠光燈正常"],


["📷 停車輔助","倒車顯影正常"],
["📷 停車輔助","倒車雷達正常"],
["📷 停車輔助","360環景正常（如有）"],


["👶 兒童安全 ISOFIX","ISOFIX固定扣確認"],
["👶 兒童安全 ISOFIX","Top Tether固定點確認"],
["👶 兒童安全 ISOFIX","兒童安全座椅實際安裝"],
["👶 兒童安全 ISOFIX","兒童安全鎖確認"],


["🎁 配件確認","行車紀錄器正常錄影"],
["🎁 配件確認","隔熱紙品牌型號確認"],
["🎁 配件確認","腳踏墊確認"],
["🎁 配件確認","後廂托盤確認"],


["📄 文件確認","第二把智慧鑰匙"],
["📄 文件確認","保固手冊"],
["📄 文件確認","VIN車身號碼一致"],
["📄 文件確認","保險資料確認"],


["📸 交車紀錄","交車里程確認"],
["📸 交車紀錄","全車照片留存"],
["📸 交車紀錄","底盤無漏油漏水"]

];



const list=document.getElementById("list");


items.forEach((item,index)=>{


let category=document.createElement("div");

category.className="category";


if(
index===0 ||
items[index-1][0]!==item[0]
){

category.innerHTML=item[0];

list.appendChild(category);

}



let div=document.createElement("div");


div.className="item";


div.innerHTML=`

<div class="item-title">

<input 
type="checkbox"
id="check${index}"
onclick="update()">

${item[1]}

</div>


<div class="status">

狀態：

<select id="status${index}">

<option value="正常">
🟢 正常
</option>

<option value="待確認">
🟡 待確認
</option>

<option value="異常">
🔴 異常
</option>

</select>


<textarea 
id="note${index}"
placeholder="備註"></textarea>


</div>

`;

list.appendChild(div);


});



document.getElementById("count").innerHTML=
"0 / "+items.length;



</script>

  <script>


function update(){

let done=0;


items.forEach((item,index)=>{

let check=
document.getElementById("check"+index);


if(check.checked){

done++;

}


});


let total=items.length;


let percent=
Math.round(done/total*100);



document.getElementById("count").innerHTML=

done+" / "+total+" ("+percent+"%)";



document.getElementById("bar").style.width=

percent+"%";


}



function saveData(){


let data={


vehicle:{


owner:
document.getElementById("owner").value,


color:
document.getElementById("color").value,


plate:
document.getElementById("plate").value,


date:
document.getElementById("date").value,


sales:
document.getElementById("sales").value


},


items:[]

};




items.forEach((item,index)=>{


data.items.push({


checked:
document.getElementById("check"+index).checked,


status:
document.getElementById("status"+index).value,


note:
document.getElementById("note"+index).value



});


});



localStorage.setItem(

"YarisCross_V21",

JSON.stringify(data)

);



alert("✅ V2.1 檢查資料已儲存");


}




function loadData(){



let data=

JSON.parse(

localStorage.getItem("YarisCross_V21")

);



if(!data){

return;

}




if(data.vehicle){


document.getElementById("owner").value=

data.vehicle.owner || "";


document.getElementById("color").value=

data.vehicle.color || "";


document.getElementById("plate").value=

data.vehicle.plate || "";


document.getElementById("date").value=

data.vehicle.date || "";


document.getElementById("sales").value=

data.vehicle.sales || "";


}



if(data.items){


data.items.forEach((item,index)=>{


let check=

document.getElementById("check"+index);



let status=

document.getElementById("status"+index);



let note=

document.getElementById("note"+index);



if(check){

check.checked=item.checked;

}


if(status){

status.value=item.status;

}


if(note){

note.value=item.note;

}


});


}



update();


}




</script>

  <div class="card">

<button onclick="saveData()">
💾 儲存 V2.1 檢查紀錄
</button>


<button onclick="clearData()">
🗑 清除重新開始
</button>

</div>



<script>


function clearData(){


if(confirm("確定要清除 V2.1 所有紀錄嗎？")){


localStorage.removeItem(
"YarisCross_V21"
);


location.reload();


}


}



window.onload=function(){

loadData();

};



</script>


</body>

</html>
